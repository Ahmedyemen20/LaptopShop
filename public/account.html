<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - My website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header class="app-header">
  <button id="hamburgerBtn" class="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <i class="fas fa-bars"></i>
  </button>
  <h2 class="app-logo"><a href="index.html" style="color: inherit; text-decoration: none; padding: 0;">Mywebsite</a></h2>
  <div class="header-icons">
    <a href="index.html" aria-label="Home"><i class="fas fa-home"></i></a>
  </div>
</header>

<div id="navOverlay" class="nav-overlay"></div>
<nav id="mainNav" class="side-drawer">
  <div id="userMenu"></div>
  <a href="index.html">home</a>
  <a href="index.html#products">products</a>
  <a href="index.html#contact-section">Contact</a>
  <a href="account.html" style="color: #FF5252;">My Account</a>
</nav>

<main class="account-page">
  <section class="account-card">
    <h1>My Account</h1>
    <div id="accountInfo" class="account-info"></div>
  </section>

  <section class="account-card">
    <h2>Order History</h2>
    <div id="ordersList"></div>
  </section>
</main>

<nav class="bottom-nav">
    <button type="button" class="bottom-nav-item" onclick="window.location.href='index.html'"><i class="fas fa-store"></i><span>Shop</span></button>
    <button type="button" class="bottom-nav-item" onclick="window.location.href='index.html#products'"><i class="fas fa-th-large"></i><span>Category</span></button>
    <button type="button" class="bottom-nav-item" onclick="window.location.href='index.html#section-search'"><i class="fas fa-search"></i><span>Search</span></button>
    <button type="button" class="bottom-nav-item" onclick="window.location.href='index.html'"><i class="fas fa-shopping-cart"></i><span>Cart</span></button>
    <button type="button" class="bottom-nav-item active"><i class="fas fa-user"></i><span>Me</span></button>
</nav>

<script>
async function init() {
    const meRes = await fetch('/api/me');
    const meData = await meRes.json();

    if (!meData.user) {
        window.location.href = 'login.html';
        return;
    }

    renderAccountUserMenu(meData.user);

    document.getElementById('accountInfo').innerHTML = `
        <p><strong>Name:</strong> ${meData.user.name}</p>
        <p><strong>Email:</strong> ${meData.user.email}</p>
    `;

    const ordersRes = await fetch('/api/orders');
    const orders = await ordersRes.json();
    const ordersList = document.getElementById('ordersList');

    if (orders.length === 0) {
        ordersList.innerHTML = `<p class="no-results">No orders yet — go grab a laptop!</p>`;
        return;
    }

    ordersList.innerHTML = orders
        .slice()
        .reverse()
        .map((order) => {
            const date = new Date(order.date).toLocaleString();
            const itemsHtml = order.items
                .map((it) => `<li>${it.name} — <span class="mono">$${it.price}</span></li>`)
                .join('');
            return `
                <div class="order-card">
                    <div class="order-card-head">
                        <span>Order #${order.id}</span>
                        <span class="mono">${date}</span>
                    </div>
                    <ul>${itemsHtml}</ul>
                    <p class="order-total mono">Total: $${order.total}</p>
                </div>
            `;
        })
        .join('');
}

function renderAccountUserMenu(user) {
    const el = document.getElementById('userMenu');
    el.innerHTML = `
        <span>Hi, ${user.name}</span>
        <button type="button" id="logoutBtn">Logout</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = 'index.html';
    });
}

init();

const hamburgerBtn = document.getElementById('hamburgerBtn');
const mainNav = document.getElementById('mainNav');
const navOverlay = document.getElementById('navOverlay');
function closeDrawer() {
    mainNav.classList.remove('open');
    navOverlay.classList.remove('open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
}
hamburgerBtn.addEventListener('click', () => {
    const isOpen = mainNav.classList.toggle('open');
    navOverlay.classList.toggle('open', isOpen);
    hamburgerBtn.setAttribute('aria-expanded', isOpen);
});
navOverlay.addEventListener('click', closeDrawer);
mainNav.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeDrawer));
</script>
</body>
</html>
