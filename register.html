<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - My website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="auth-sub">Join to save your cart and orders</p>
    <form id="registerForm">
      <label for="name">Name</label>
      <input class="form-input" type="text" id="name" required>
      <label for="email">Email</label>
      <input class="form-input" type="email" id="email" required>
      <label for="password">Password</label>
      <input class="form-input" type="password" id="password" required minlength="4">
      <p class="auth-error" id="errorMsg"></p>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = '';
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
            errorMsg.textContent = data.error || 'Something went wrong';
            return;
        }
        window.location.href = 'index.html';
    } catch (err) {
        errorMsg.textContent = 'Could not reach the server';
    }
});
</script>
</body>
</html>
